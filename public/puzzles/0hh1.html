<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>0h h1 · 哦嗨</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="topbar">
  <a class="back" href="index.html">← 返回</a>
  <div class="title">0 h &nbsp; h 1</div>
  <div class="stat" id="timer" role="timer" aria-label="已用时间">00:00</div>
</div>
<div class="stage">
  <div class="row">
    <select id="size" aria-label="棋盘尺寸"></select>
    <button class="btn" id="new">新 游 戏</button>
  </div>
  <div id="grid" class="tgrid" role="group" aria-label="黑白棋盘" aria-describedby="rules keyboard-help"></div>
  <div class="stat" id="msg" role="status" aria-live="polite" aria-atomic="true"></div>
  <div class="hint" id="rules"></div>
  <p class="hint keyboard-help" id="keyboard-help">方向键移动格子，Home / End 到行首 / 行尾，空格或 Enter 操作；Tab 离开棋盘。按住 Shift 可反向切换。</p>
</div>
<script src="js/grid-input.js"></script>
<script src="js/takuzu.js"></script>
<script>
mountTakuzu({
  key: 'ohh1',
  skin: 'blocks',
  sizes: [4, 6, 8, 10],
  def: 6,
  rules: '点按格子：空格 → 黑 → 白 → 空格（右键反向）。规则：每行每列黑白数量相同；任何方向不得三连同色；不得出现完全相同的两行或两列。带小圆点的是给定格。'
});
</script>
</body>
</html>
